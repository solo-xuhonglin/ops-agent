services:
  # ===== 数据库（PostgreSQL + pgvector）=====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ops-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===== 对象存储（MinIO，S3 兼容）=====
  minio:
    image: minio/minio:latest
    container_name: ops-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # 初始化 MinIO 桶（datasets / models / artifacts）
  minio-init:
    image: minio/mc:latest
    container_name: ops-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ops http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p ops/${MINIO_BUCKET};
      mc mb -p ops/models;
      mc mb -p ops/artifacts;
      echo 'MinIO buckets initialized';
      "

  # ===== 后端（Spring Boot）=====
  admin:
    build:
      context: ./ops-agent-admin
      dockerfile: Dockerfile
    container_name: ops-agent-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_INIT_ENABLED: ${APP_INIT_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: docker
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_PUBLIC_READ: "false"
    ports:
      - "${ADMIN_PORT}:8080"
    # 如需后续动态拉起 training/serving 容器，取消下行注释挂载 docker.sock
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  # ===== 前端（nginx 托管 dist + 反向代理）=====
  front:
    build:
      context: ./ops-agent-front
      dockerfile: Dockerfile
    container_name: ops-agent-front
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "${HTTP_PORT}:80"

volumes:
  pgdata:
  minio-data:
