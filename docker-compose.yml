services:
  # ===== 数据库（PostgreSQL + pgvector）=====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ops-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ===== 后端（Spring Boot）=====
  admin:
    build:
      context: ./ops-agent-admin
      dockerfile: Dockerfile
    container_name: ops-agent-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "${ADMIN_PORT}:8080"
    # 如需后续动态拉起 training/serving 容器，取消下行注释挂载 docker.sock
    # volumes:
    #   - /var/run/docker.sock:/var/run/docker.sock

  # ===== 前端（nginx 托管 dist + 反向代理）=====
  front:
    build:
      context: ./ops-agent-front
      dockerfile: Dockerfile
    container_name: ops-agent-front
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "${HTTP_PORT}:80"

volumes:
  pgdata:
