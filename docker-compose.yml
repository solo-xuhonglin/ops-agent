services:
  # ===== 数据库（PostgreSQL + pgvector）=====
  postgres:
    image: pgvector/pgvector:pg17
    container_name: ops-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opsnet

  # ===== 对象存储（MinIO，S3 兼容）=====
  minio:
    image: minio/minio:latest
    container_name: ops-agent-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - opsnet

  # 初始化 MinIO 桶（datasets / models / logs）
  minio-init:
    image: minio/mc:latest
    container_name: ops-agent-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set ops http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
      mc mb -p --ignore-existing ops/${MINIO_BUCKET};
      mc mb -p --ignore-existing ops/${MINIO_MODEL_BUCKET:-models};
      mc mb -p --ignore-existing ops/${MINIO_LOG_BUCKET:-logs};
      echo 'MinIO buckets initialized';
      "
    networks:
      - opsnet

  # ===== 后端（Spring Boot）=====
  admin:
    build:
      context: ./ops-agent-admin
      dockerfile: Dockerfile
    container_name: ops-agent-admin
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      APP_INIT_ENABLED: ${APP_INIT_ENABLED:-true}
      SPRING_PROFILES_ACTIVE: docker
      MINIO_ENABLED: ${MINIO_ENABLED:-true}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET}
      MINIO_MODEL_BUCKET: ${MINIO_MODEL_BUCKET:-models}
      MINIO_LOG_BUCKET: ${MINIO_LOG_BUCKET:-logs}
      MINIO_PUBLIC_READ: "false"
      # 训练编排：镜像名 / 网络 / 超时
      TRAIN_ENABLED: ${TRAIN_ENABLED:-true}
      TRAIN_IMAGE: ${TRAIN_IMAGE:-ops-agent-train:latest}
      TRAIN_NETWORK: ${TRAIN_NETWORK:-ops-agent-opsnet}
      TRAIN_TIMEOUT_MINUTES: ${TRAIN_TIMEOUT_MINUTES:-60}
      # serving 编排：镜像名 / 网络 / 就绪超时
      SERVING_ENABLED: ${SERVING_ENABLED:-true}
      SERVING_IMAGE: ${SERVING_IMAGE:-ops-agent-serving:latest}
      SERVING_NETWORK: ${SERVING_NETWORK:-ops-agent-opsnet}
      SERVING_READY_TIMEOUT_SECONDS: ${SERVING_READY_TIMEOUT_SECONDS:-60}
    ports:
      - "${ADMIN_PORT}:8080"
    # 动态拉起 training/serving 容器需要挂载宿主 docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - opsnet

  # ===== 前端（nginx 托管 dist + 反向代理）=====
  front:
    build:
      context: ./ops-agent-front
      dockerfile: Dockerfile
    container_name: ops-agent-front
    restart: unless-stopped
    depends_on:
      - admin
    ports:
      - "${HTTP_PORT}:80"
    networks:
      - opsnet

  # ===== 训练镜像（仅构建，不随 up 启动；由 admin 经 docker-java 动态实例化）=====
  train:
    image: ops-agent-train:latest
    build:
      context: ./ops-agent-data-train
      dockerfile: Dockerfile
    container_name: ops-agent-train
    profiles:
      - tools
    networks:
      - opsnet

  # ===== serving 推理镜像（仅构建，不随 up 启动；由 admin 经 docker-java 动态实例化）=====
  serving:
    image: ops-agent-serving:latest
    build:
      context: ./ops-agent-data-service
      dockerfile: Dockerfile
    container_name: ops-agent-serving
    profiles:
      - tools
    networks:
      - opsnet

volumes:
  pgdata:
  minio-data:

networks:
  opsnet:
    name: ops-agent-opsnet
    driver: bridge
