syntax = "proto3";

package opsagent.agent;

option java_multiple_files = true;
option java_package = "com.opsagent.admin.agent.proto";
option java_outer_classname = "AgentProto";

// admin 为 gRPC server，agent 为 client 出站拨号；一条双向流承载 worker 内多 agent
// 职责边界：admin 只做通信与审批动作，流程控制与持久化完全由 agent 负责
// （agent 直连 PostgreSQL 写 agent_tasks/agent_plans/agent_suggestions，gRPC 纯透传）
service AgentService {
  rpc Connect(stream ClientMessage) returns (stream ServerMessage);
}

message ClientMessage {
  reserved 6, 7;  // 曾为 async_suggestion / task_plan（agent 直写库替代，字段号不复用）
  oneof msg {
    Register register = 1;
    TaskEvent task_event = 2;
    TaskResult task_result = 3;
    AgentUpdate agent_update = 4;
    Pong pong = 5;
  }
}

message ServerMessage {
  reserved 5;     // 曾为 authorization_grant（grant_key 已并入 TaskDispatch）
  oneof msg {
    RegisterAck register_ack = 1;
    TaskDispatch task_dispatch = 2;
    CancelTask cancel_task = 3;
    Ping ping = 4;
  }
}

message AgentInfo {
  string agent_id = 1;
  repeated string capabilities = 2;
}

message Register {
  string worker_id = 1;
  repeated AgentInfo agents = 2;
}

message RegisterAck {
  bool ok = 1;
  string message = 2;
  // 动态下发的工具 schema（OpenAI function calling 格式），agent 零硬编码
  repeated ToolSchema tools = 3;
}

message ToolSchema {
  string name = 1;
  string description = 2;
  string parameters = 3;   // OpenAI JSON Schema 的 JSON 字符串
  bool is_write = 4;
  string http_method = 5;  // GET/POST/DELETE（agent 直调 admin 现有 API）
  string path_template = 6; // /api/training/jobs/{jobId}
}

message TaskEvent {
  string task_id = 1;
  int32 seq = 2;
  // progress / thinking / delta / tool_call / tool_result / error / plan_update
  //  thinking:    LLM 推理链增量文本
  //  delta:       答复增量文本（流式回显）
  //  tool_call:   JSON {"name","args"}
  //  tool_result: JSON {"name","summary"}
  //  plan_update: JSON {planId,status,summary,message}（agent 直写库后通知 admin 刷新/落消息）
  string event_type = 3;
  string content = 4;
}

message Suggestion {
  string action_type = 1;
  string target_type = 2;
  int64 target_id = 3;
  string params = 4;       // JSON 字符串
  string reason = 5;
  string priority = 6;     // HIGH / NORMAL / LOW
}

message TaskResult {
  string task_id = 1;
  bool ok = 2;
  string conclusion = 3;
  // deprecated: agent 直写 agent_suggestions，此字段不再使用（保留字段号不复用）
  repeated Suggestion suggestions = 4 [deprecated = true];
  string error = 5;
  string reasoning = 6;   // 聚合后的 LLM 推理链全文（可折叠展示）
}

message TaskDispatch {
  string task_id = 1;
  string query = 2;          // chat：用户问询；execute：可空（动作由结构化字段表达）
  string task_token = 3;     // scoped JWT（execute 用长 TTL 覆盖异步跟踪期）
  string history = 4;        // chat：多轮对话历史 JSON [{"role","content"},...]
  string conversation_id = 5; // 所属会话（对话/审批执行有；后台直派为空）
  string suggestion_id = 6;  // execute：对应建议（UUID 字符串）；空=普通任务
  string target_type = 7;    // 诊断目标类型（可选）
  int64 target_id = 8;
  string task_type = 9;      // chat | execute
  string action_type = 10;   // execute：写工具名（training_create 等）
  string params = 11;        // execute：动作参数 JSON（不再由 LLM 解析 query）
  string grant_key = 12;     // execute：approve 后签发（替代 AuthorizationGrant 单独推送）
}

message CancelTask {
  string task_id = 1;
  string reason = 2;
}

message AgentUpdate {
  repeated AgentInfo agents = 1;
}

message Ping {
  int64 ts = 1;
}

message Pong {
  int64 ts = 1;
}
