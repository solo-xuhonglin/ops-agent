server:
  port: 8080

spring:
  application:
    name: ops-agent-admin
  datasource:
    url: jdbc:postgresql://postgres:5432/opsagent
    username: ${DB_USERNAME:opsagent}
    password: ${DB_PASSWORD:opsagent}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 200MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

jwt:
  secret: ${JWT_SECRET:change-me-in-production-please-use-a-long-random-secret-key}
  expiration-ms: 86400000        # access token 有效期 24h
  refresh-expiration-ms: 604800000  # refresh token 7d

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}

minio:
  enabled: ${MINIO_ENABLED:true}
  endpoint: ${MINIO_ENDPOINT:http://minio:9000}
  access-key: ${MINIO_ACCESS_KEY:minioadmin}
  secret-key: ${MINIO_SECRET_KEY:minioadmin}
  bucket: ${MINIO_BUCKET:datasets}
  model-bucket: ${MINIO_MODEL_BUCKET:models}
  log-bucket: ${MINIO_LOG_BUCKET:logs}
  public-read: ${MINIO_PUBLIC_READ:false}

train:
  enabled: ${TRAIN_ENABLED:true}
  image: ${TRAIN_IMAGE:ops-agent-train:latest}
  network: ${TRAIN_NETWORK:ops-agent-opsnet}
  timeout-minutes: ${TRAIN_TIMEOUT_MINUTES:60}

serving:
  enabled: ${SERVING_ENABLED:true}
  image: ${SERVING_IMAGE:ops-agent-serving:latest}
  network: ${SERVING_NETWORK:ops-agent-opsnet}
  ready-timeout-seconds: ${SERVING_READY_TIMEOUT_SECONDS:60}
  health-check-interval-ms: ${SERVING_HEALTH_CHECK_INTERVAL_MS:30000}
  unhealthy-threshold: ${SERVING_UNHEALTHY_THRESHOLD:3}

grpc:
  server:
    port: ${AGENT_GRPC_PORT:9090}
    # 内网长连接，鉴权在 HTTP 层（scoped taskToken）+ 注册机制；
    # 禁用 grpc starter 的 spring-security 自动配置（否则因缺 GrpcAuthenticationReader 启动失败）
    security:
      enabled: false

# Redis（grantKey 权威存储：时效 TTL + GETDEL 原子消费）
agent:
  grant:
    ttl-seconds: ${AGENT_GRANT_TTL_SECONDS:600}
    key-prefix: "agent:grant:"
  task:
    timeout-seconds: ${AGENT_TASK_TIMEOUT_SECONDS:300}
