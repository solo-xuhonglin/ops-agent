[pytest]
testpaths = tests
pythonpath = .
markers =
    tier1: core dataset metadata CRUD (create/list/get/update/delete)
    tier2: MinIO file upload link (real object-storage verification)
    model_training: model version + training job lifecycle (incl. real run)
    serving: model serving endpoints (deploy/predict/undeploy lifecycle)
    agent: agent task/suggestion/tool lifecycle (contract + full gRPC-worker cycle)
    agent_e2e: agent full cycle requiring a controlled fake worker (AGENT_E2E=1)
    agent_real: real-LLM scenario tests requiring an online worker (REAL_AGENT=1)
    negative: auth / error-path cases
addopts = -v -ra
